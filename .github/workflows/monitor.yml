name: Toyota Katamichi GO Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Toyota Katamichi GO
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FILTER_START: ${{ vars.FILTER_START }}
          FILTER_RETURN: ${{ vars.FILTER_RETURN }}
          FILTER_CAR: ${{ vars.FILTER_CAR }}
        run: python monitor.py

      - name: Save state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "update state"
          git push
